<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f4f2ec"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202020">
    <text x="70" y="70" font-size="34" font-weight="700">HD_Slide — access / load-path lookdev</text>
    <text x="70" y="108" font-size="18">Implementation diagram only — not Visual Fidelity evidence</text>

    <text x="70" y="165" font-size="23" font-weight="700">SIDE ELEVATION (local Y / Z)</text>
    <line x1="80" y1="590" x2="950" y2="590" stroke="#4a4a4a" stroke-width="3"/>
    <text x="82" y="618" font-size="16">grade Y=0</text>

    <rect x="590" y="226" width="260" height="18" fill="#315e72" stroke="#202020" stroke-width="2"/>
    <text x="610" y="214" font-size="16">platform top ≈ 2.058 m</text>

    <g fill="#315e72" stroke="#202020" stroke-width="1.5">
      <rect x="205" y="548" width="94" height="5"/><rect x="245" y="514" width="94" height="5"/>
      <rect x="285" y="480" width="94" height="5"/><rect x="325" y="446" width="94" height="5"/>
      <rect x="365" y="412" width="94" height="5"/><rect x="405" y="378" width="94" height="5"/>
      <rect x="445" y="344" width="94" height="5"/><rect x="485" y="310" width="94" height="5"/>
      <rect x="525" y="276" width="94" height="5"/><rect x="565" y="242" width="94" height="5"/>
    </g>
    <line x1="182" y1="571" x2="642" y2="237" stroke="#315e72" stroke-width="13" stroke-linecap="round"/>
    <line x1="204" y1="432" x2="625" y2="126" stroke="#315e72" stroke-width="10" stroke-linecap="round"/>
    <text x="120" y="365" font-size="17">10 horizontal treads</text>
    <text x="120" y="388" font-size="17">180 mm depth / 190 mm nominal rise</text>
    <text x="120" y="411" font-size="17">access pitch ≈ 50.9°</text>
    <text x="121" y="434" font-size="17">48.6 mm coated-steel side stringers</text>

    <rect x="169" y="576" width="52" height="8" fill="#315e72" stroke="#202020" stroke-width="1.5"/>
    <text x="108" y="655" font-size="16">14 mm foot plate seats at grade</text>

    <path d="M 742 248 C 828 313, 910 432, 1010 520 C 1085 563, 1160 570, 1250 565" fill="none" stroke="#7c8589" stroke-width="7"/>
    <path d="M 742 241 C 828 306, 910 425, 1010 513 C 1085 556, 1160 563, 1250 558" fill="none" stroke="#d6d9da" stroke-width="3"/>
    <text x="850" y="332" font-size="16">2 mm SUS304 continuous chute</text>

    <line x1="709" y1="251" x2="777" y2="251" stroke="#315e72" stroke-width="14" stroke-linecap="round"/>
    <line x1="719" y1="251" x2="682" y2="273" stroke="#315e72" stroke-width="10" stroke-linecap="round"/>
    <line x1="767" y1="251" x2="805" y2="273" stroke="#315e72" stroke-width="10" stroke-linecap="round"/>
    <text x="680" y="304" font-size="15">head bearing: chute rests on transverse frame member</text>

    <line x1="1204" y1="567" x2="1270" y2="567" stroke="#315e72" stroke-width="12" stroke-linecap="round"/>
    <line x1="1218" y1="567" x2="1218" y2="582" stroke="#315e72" stroke-width="10"/>
    <line x1="1256" y1="567" x2="1256" y2="582" stroke="#315e72" stroke-width="10"/>
    <rect x="1205" y="582" width="25" height="6" fill="#315e72"/><rect x="1244" y="582" width="25" height="6" fill="#315e72"/>
    <text x="1110" y="630" font-size="16">runout ≈150 mm above grade</text>
    <text x="1110" y="653" font-size="16">cross-bearer → short posts → grade plates</text>

    <line x1="147" y1="552" x2="147" y2="242" stroke="#777" stroke-width="1.5"/>
    <line x1="138" y1="552" x2="156" y2="552" stroke="#777" stroke-width="1.5"/>
    <line x1="138" y1="242" x2="156" y2="242" stroke="#777" stroke-width="1.5"/>
    <text x="88" y="404" font-size="16" transform="rotate(-90 88 404)">~2.06 m deck surface</text>

    <text x="70" y="730" font-size="23" font-weight="700">TREAD / SIDE-STRINGER BRACKET SECTION + MATERIAL RESPONSE</text>
    <rect x="120" y="790" width="312" height="7" fill="#315e72" stroke="#202020" stroke-width="1.5"/>
    <rect x="420" y="797" width="48" height="25" fill="#315e72" stroke="#202020" stroke-width="1.5"/>
    <circle cx="476" cy="812" r="19" fill="#315e72" stroke="#202020" stroke-width="1.5"/>
    <line x1="432" y1="776" x2="432" y2="838" stroke="#777" stroke-dasharray="6 5"/>
    <text x="120" y="772" font-size="16">780 × 180 × 3.2 mm horizontal tread plate</text>
    <text x="120" y="850" font-size="16">tread edge ends before the inclined tube; welded 60 × 25 × 60 mm bracket bridges to the side stringer</text>
    <text x="120" y="874" font-size="16">minimum plate-to-stringer lateral clearance 15 mm — no horizontal plate / round-pipe interpenetration</text>

    <g font-size="16">
      <text x="760" y="785" font-weight="700">Coated structural steel</text>
      <text x="760" y="810">dielectric: metallic 0 / F0≈0.04 / roughness 0.58–0.78</text>
      <text x="760" y="833">UV chalking on exposed faces; foot/touch polish only where contact occurs</text>
      <text x="760" y="870" font-weight="700">SUS304 chute</text>
      <text x="760" y="895">metallic 0.82–1.0 / roughness 0.16–0.34 / directional travel abrasion</text>
      <text x="760" y="918">grazing highlight must come from BRDF + sun/sky/probes, never albedo paint</text>
    </g>

    <text x="70" y="965" font-size="15">LOD policy: treads/brackets/side stringers/rails/head + runout supports persist through LOD0/1/2/3; only sub-pixel fastener heads disappear after LOD0.</text>
  </g>
</svg>
