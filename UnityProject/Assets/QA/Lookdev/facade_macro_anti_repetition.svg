<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f4f2ec"/>
  <text x="70" y="70" font-family="sans-serif" font-size="34" font-weight="700" fill="#202020">Painted-RC facade — macro anti-repetition lookdev</text>
  <text x="70" y="108" font-family="sans-serif" font-size="19" fill="#444">Formal generated fallback · 26 m apartment facade · live-action 4K target</text>

  <g transform="translate(70 160)">
    <rect x="0" y="0" width="1170" height="330" rx="6" fill="#a8a69e" stroke="#555" stroke-width="2"/>
    <g stroke="#777" stroke-width="2" opacity="0.7">
      <line x1="187" y1="0" x2="187" y2="330"/><line x1="374" y1="0" x2="374" y2="330"/>
      <line x1="561" y1="0" x2="561" y2="330"/><line x1="748" y1="0" x2="748" y2="330"/>
      <line x1="935" y1="0" x2="935" y2="330"/>
    </g>
    <g fill="#48565a" stroke="#333" stroke-width="2">
      <rect x="35" y="65" width="115" height="90"/><rect x="222" y="65" width="115" height="90"/>
      <rect x="409" y="65" width="115" height="90"/><rect x="596" y="65" width="115" height="90"/>
      <rect x="783" y="65" width="115" height="90"/><rect x="970" y="65" width="115" height="90"/>
      <rect x="35" y="205" width="115" height="90"/><rect x="222" y="205" width="115" height="90"/>
      <rect x="409" y="205" width="115" height="90"/><rect x="596" y="205" width="115" height="90"/>
      <rect x="783" y="205" width="115" height="90"/><rect x="970" y="205" width="115" height="90"/>
    </g>
    <text x="0" y="365" font-family="sans-serif" font-size="18" fill="#333">Manufactured apartment modules may repeat. The coating texture must not visibly stamp the same material patch across them.</text>
  </g>

  <g transform="translate(70 575)">
    <text x="0" y="0" font-family="sans-serif" font-size="23" font-weight="700" fill="#222">Two independent material scales</text>
    <rect x="0" y="30" width="310" height="90" fill="#c7c4ba" stroke="#555"/>
    <g stroke="#777" stroke-width="3"><line x1="95" y1="30" x2="95" y2="120"/><line x1="190" y1="30" x2="190" y2="120"/><line x1="285" y1="30" x2="285" y2="120"/></g>
    <text x="0" y="150" font-family="sans-serif" font-size="18" fill="#333">Primary: 2.4 m aggregate/coating field</text>

    <rect x="420" y="30" width="310" height="90" fill="#c7c4ba" stroke="#555"/>
    <path d="M420 77 C470 47 520 108 570 73 S670 52 730 87" fill="none" stroke="#8b897f" stroke-width="12" opacity="0.55"/>
    <text x="420" y="150" font-family="sans-serif" font-size="18" fill="#333">Secondary: 7.9 m neutral finish/application variation</text>

    <rect x="840" y="30" width="420" height="90" fill="#c7c4ba" stroke="#555"/>
    <text x="860" y="65" font-family="sans-serif" font-size="18" fill="#222">Exact combined phase returns at 189.6 m</text>
    <text x="860" y="94" font-family="sans-serif" font-size="18" fill="#222">≫ 26 m hero facade width</text>
    <text x="840" y="150" font-family="sans-serif" font-size="18" fill="#333">Source-side anti-repeat only; native 4K review remains authoritative.</text>
  </g>

  <g transform="translate(70 790)">
    <text x="0" y="0" font-family="sans-serif" font-size="21" font-weight="700" fill="#222">Physical constraints</text>
    <text x="0" y="34" font-family="sans-serif" font-size="18" fill="#333">RC substrate + cementitious render + matte protective coating · metallic 0 · F0 ≈ 0.04 · roughness 0.79–0.93</text>
    <text x="0" y="63" font-family="sans-serif" font-size="18" fill="#333">No baked sun, shadow, Fresnel, runoff or stains. Geometry owns openings/returns/drips/joints; weathering stays source- and exposure-driven.</text>
  </g>
</svg>
