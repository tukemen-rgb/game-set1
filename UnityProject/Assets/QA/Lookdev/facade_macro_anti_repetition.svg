<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#f4f2ec"/><text x="70" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#222">Painted-RC facade — independent-frequency lookdev</text><text x="70" y="103" font-family="sans-serif" font-size="19" fill="#444">26 m hero facade · physical UV0 · Standard BRDF surface shader</text><g transform="translate(70 145)"><rect width="1170" height="300" fill="#aaa89f" stroke="#555" stroke-width="2"/><g stroke="#777" stroke-width="2"><line x1="195" y1="0" x2="195" y2="300"/><line x1="390" y1="0" x2="390" y2="300"/><line x1="585" y1="0" x2="585" y2="300"/><line x1="780" y1="0" x2="780" y2="300"/><line x1="975" y1="0" x2="975" y2="300"/></g><g fill="#526065" stroke="#333"><rect x="36" y="55" width="120" height="80"/><rect x="231" y="55" width="120" height="80"/><rect x="426" y="55" width="120" height="80"/><rect x="621" y="55" width="120" height="80"/><rect x="816" y="55" width="120" height="80"/><rect x="1011" y="55" width="120" height="80"/><rect x="36" y="180" width="120" height="80"/><rect x="231" y="180" width="120" height="80"/><rect x="426" y="180" width="120" height="80"/><rect x="621" y="180" width="120" height="80"/><rect x="816" y="180" width="120" height="80"/><rect x="1011" y="180" width="120" height="80"/></g></g><g transform="translate(70 500)" font-family="sans-serif"><text x="0" y="0" font-size="24" font-weight="700" fill="#222">Three independent physical frequencies</text><rect x="0" y="35" width="350" height="90" fill="#c9c6bc" stroke="#555"/><g stroke="#777" stroke-width="3"><line x1="105" y1="35" x2="105" y2="125"/><line x1="210" y1="35" x2="210" y2="125"/><line x1="315" y1="35" x2="315" y2="125"/></g><text x="0" y="155" font-size="18" fill="#333">2.4 m primary coating / aggregate</text><rect x="410" y="35" width="350" height="90" fill="#c9c6bc" stroke="#555"/><g stroke="#74716b" stroke-width="2" opacity=".8"><path d="M410 50 l350 60 M410 70 l330 55 M430 35 l330 58 M410 105 l120-70 M540 125 l160-90"/></g><text x="410" y="155" font-size="18" fill="#333">0.22 m detail normal — lighting only</text><rect x="820" y="35" width="350" height="90" fill="#c9c6bc" stroke="#555"/><path d="M820 82 C875 45 925 115 980 76 S1090 48 1170 90" fill="none" stroke="#8e8b82" stroke-width="13" opacity=".55"/><text x="820" y="155" font-size="18" fill="#333">7.9 m neutral macro finish variation</text><text x="0" y="215" font-size="20" font-weight="700" fill="#222">Primary + macro exact phase recurrence: 189.6 m ≫ 26 m facade</text><text x="0" y="250" font-size="18" fill="#333">Important: built-in Standard shares one secondary-map UV transform. The 7.9 m albedo field must NOT stretch the 0.22 m detail normal.</text><text x="0" y="290" font-size="18" fill="#333">No baked sun/shadow/Fresnel/runoff. Openings, returns, drips and joints remain geometry; stains remain cause-based weathering.</text><text x="0" y="330" font-size="18" fill="#333">Metallic 0 · F0 ≈ 0.04 · roughness 0.79–0.93 · runtime/4K verification pending.</text></g></svg>