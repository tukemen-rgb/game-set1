<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe8f0"/>
      <stop offset="1" stop-color="#f6f2e8"/>
    </linearGradient>
    <linearGradient id="grazing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2b29"/>
      <stop offset="0.72" stop-color="#77736b"/>
      <stop offset="0.82" stop-color="#b8ad95"/>
      <stop offset="1" stop-color="#5d5a54"/>
    </linearGradient>
    <pattern id="concrete" width="54" height="54" patternUnits="userSpaceOnUse">
      <rect width="54" height="54" fill="#9f9c93"/>
      <circle cx="9" cy="14" r="2.2" fill="#827f78"/>
      <circle cx="31" cy="36" r="1.5" fill="#bbb7ac"/>
      <circle cx="46" cy="20" r="2.8" fill="#8c8982"/>
      <path d="M4 46 C16 40,23 51,35 44 S49 43,54 48" fill="none" stroke="#a9a59c" stroke-width="1"/>
    </pattern>
    <pattern id="bark" width="46" height="100" patternUnits="userSpaceOnUse">
      <rect width="46" height="100" fill="#4b3222"/>
      <path d="M8 0 C2 20,15 36,7 55 S13 83,8 100 M24 0 C18 17,31 34,22 51 S31 80,25 100 M39 0 C32 16,43 40,36 57 S44 80,38 100" fill="none" stroke="#6e4930" stroke-width="5"/>
      <path d="M10 0 C7 23,18 37,10 58 S17 83,12 100 M27 0 C22 20,35 38,26 56 S34 82,29 100" fill="none" stroke="#302116" stroke-width="2"/>
    </pattern>
    <pattern id="grass" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#697947"/>
      <path d="M6 42 L12 9 M15 42 L20 18 M22 42 L28 6 M31 42 L34 14 M38 42 L40 23" stroke="#334b28" stroke-width="3"/>
      <path d="M8 42 L16 21 M19 42 L24 12 M29 42 L36 18" stroke="#91a365" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b4f2a"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f5f3ed"/>
  <rect x="0" y="0" width="1600" height="158" fill="url(#sky)"/>
  <text x="70" y="72" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#222">Generic PBR Microtexture Precision — Lookdev Plate</text>
  <text x="70" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4a4a47">Dry midsummer Japanese daylight baseline · physical-data import gate · no baked highlights</text>

  <g transform="translate(70,210)">
    <rect width="450" height="450" rx="12" fill="#ffffff" stroke="#c9c5bb" stroke-width="2"/>
    <text x="28" y="44" font-family="Arial" font-size="28" font-weight="700" fill="#292925">A · Exterior concrete</text>
    <rect x="28" y="72" width="394" height="220" fill="url(#concrete)" stroke="#807d76"/>
    <path d="M52 270 C120 235,190 250,258 218 S370 205,407 177" fill="none" stroke="#f6e7b6" stroke-width="9" opacity="0.62"/>
    <text x="28" y="330" font-family="Arial" font-size="19" fill="#333">Geometry: slab/fascia thickness, seams, interfaces</text>
    <text x="28" y="362" font-family="Arial" font-size="19" fill="#333">Material: pores + fine aggregate only</text>
    <text x="28" y="394" font-family="Arial" font-size="19" fill="#333">Roughness 0.88 · metallic 0 · wetness 0</text>
    <text x="28" y="426" font-family="Arial" font-size="19" fill="#333">Grazing highlight must follow sun/sky, never texture paint</text>
  </g>

  <g transform="translate(575,210)">
    <rect width="450" height="450" rx="12" fill="#ffffff" stroke="#c9c5bb" stroke-width="2"/>
    <text x="28" y="44" font-family="Arial" font-size="28" font-weight="700" fill="#292925">B · Bark / trunk interface</text>
    <rect x="120" y="72" width="210" height="220" rx="64" fill="url(#bark)" stroke="#2e2017"/>
    <path d="M112 250 C83 229,75 197,89 172" fill="none" stroke="#6b4f2a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="28" y="330" font-family="Arial" font-size="19" fill="#333">Geometry: taper, branch junctions, silhouette</text>
    <text x="28" y="362" font-family="Arial" font-size="19" fill="#333">Material: fibre/ridge microrelief, no fixed-light streak</text>
    <text x="28" y="394" font-family="Arial" font-size="19" fill="#333">Roughness 0.95 · metallic 0 · dry dielectric</text>
    <text x="28" y="426" font-family="Arial" font-size="19" fill="#333">Mip/aniso must suppress distant ridge sparkle</text>
  </g>

  <g transform="translate(1080,210)">
    <rect width="450" height="450" rx="12" fill="#ffffff" stroke="#c9c5bb" stroke-width="2"/>
    <text x="28" y="44" font-family="Arial" font-size="28" font-weight="700" fill="#292925">C · Grass / leaf response</text>
    <rect x="28" y="72" width="394" height="220" fill="url(#grass)" stroke="#59643f"/>
    <ellipse cx="307" cy="157" rx="82" ry="40" transform="rotate(-24 307 157)" fill="#496d2c" stroke="#29451c" stroke-width="3"/>
    <path d="M243 183 C288 162,319 142,368 127" fill="none" stroke="#86a66a" stroke-width="3"/>
    <text x="28" y="330" font-family="Arial" font-size="19" fill="#333">Geometry: clumps/cards + leaf silhouette</text>
    <text x="28" y="362" font-family="Arial" font-size="19" fill="#333">Material: blade/vein-scale normal + roughness</text>
    <text x="28" y="394" font-family="Arial" font-size="19" fill="#333">Leaf roughness 0.85–0.86 · metallic 0 · wetness 0</text>
    <text x="28" y="426" font-family="Arial" font-size="19" fill="#333">No painted sun spot; verify subpixel shimmer temporally</text>
  </g>

  <g transform="translate(70,715)">
    <rect width="1460" height="210" rx="12" fill="#fff" stroke="#c9c5bb" stroke-width="2"/>
    <text x="28" y="44" font-family="Arial" font-size="26" font-weight="700" fill="#292925">Formal evidence sequence</text>
    <line x1="40" y1="90" x2="1395" y2="90" stroke="#7b766c" stroke-width="3"/>
    <circle cx="125" cy="90" r="18" fill="#ece7dc" stroke="#6d675d" stroke-width="3"/>
    <circle cx="425" cy="90" r="18" fill="#ece7dc" stroke="#6d675d" stroke-width="3"/>
    <circle cx="725" cy="90" r="18" fill="#ece7dc" stroke="#6d675d" stroke-width="3"/>
    <circle cx="1025" cy="90" r="18" fill="#ece7dc" stroke="#6d675d" stroke-width="3"/>
    <circle cx="1325" cy="90" r="18" fill="#ece7dc" stroke="#6d675d" stroke-width="3"/>
    <text x="72" y="142" font-family="Arial" font-size="19" fill="#333">3840×2160 frontal</text>
    <text x="374" y="142" font-family="Arial" font-size="19" fill="#333">oblique</text>
    <text x="672" y="142" font-family="Arial" font-size="19" fill="#333">grazing light</text>
    <text x="945" y="142" font-family="Arial" font-size="19" fill="#333">100% crops</text>
    <text x="1220" y="142" font-family="Arial" font-size="19" fill="#333">temporal</text>
    <text x="28" y="184" font-family="Arial" font-size="18" fill="#5b574f">Score only observed pixels. Import readiness may block invalid evidence but never awards Visual Fidelity points.</text>
  </g>
</svg>
