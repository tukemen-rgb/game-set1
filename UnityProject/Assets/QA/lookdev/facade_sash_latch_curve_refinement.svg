<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f4f2ec"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1c1c1c">
    <text x="70" y="75" font-size="34" font-weight="700">Facade sash latch — LOD0 crescent curve lookdev</text>
    <text x="70" y="112" font-size="19">Reconstruction study only · not an exact product identification · rendered evidence remains authoritative</text>

    <g transform="translate(90 180)">
      <text x="0" y="0" font-size="25" font-weight="700">Front / silhouette</text>
      <rect x="155" y="95" width="90" height="246" rx="10" fill="none" stroke="#555" stroke-width="5"/>
      <circle cx="200" cy="218" r="33" fill="none" stroke="#555" stroke-width="5"/>
      <path d="M 254 119 A 102 102 0 0 1 254 317" fill="none" stroke="#303030" stroke-width="31" stroke-linecap="round"/>
      <path d="M 254 119 A 102 102 0 0 1 254 317" fill="none" stroke="#b9bab4" stroke-width="20" stroke-linecap="round"/>
      <line x1="200" y1="143" x2="200" y2="293" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="8 8"/>
      <circle cx="200" cy="143" r="7" fill="#444"/>
      <circle cx="200" cy="293" r="7" fill="#444"/>
      <line x1="92" y1="143" x2="92" y2="293" stroke="#222" stroke-width="2"/>
      <line x1="80" y1="143" x2="104" y2="143" stroke="#222" stroke-width="2"/>
      <line x1="80" y1="293" x2="104" y2="293" stroke="#222" stroke-width="2"/>
      <text x="10" y="225" font-size="20">50 mm screw pitch</text>
      <line x1="330" y1="109" x2="400" y2="60" stroke="#222" stroke-width="2"/>
      <text x="410" y="63" font-size="20">true swept silhouette</text>
      <text x="410" y="91" font-size="18">34 mm centerline radius</text>
      <text x="410" y="117" font-size="18">130° sweep · 32 arc rings</text>
      <text x="410" y="143" font-size="18">no six-box stepping in LOD0</text>
    </g>

    <g transform="translate(850 180)">
      <text x="0" y="0" font-size="25" font-weight="700">Lever cross-section</text>
      <polygon points="125,105 165,105 185,125 185,165 165,185 125,185 105,165 105,125" fill="#b9bab4" stroke="#303030" stroke-width="5"/>
      <line x1="105" y1="230" x2="185" y2="230" stroke="#222" stroke-width="2"/>
      <line x1="105" y1="220" x2="105" y2="240" stroke="#222" stroke-width="2"/>
      <line x1="185" y1="220" x2="185" y2="240" stroke="#222" stroke-width="2"/>
      <text x="105" y="263" font-size="19">10 mm</text>
      <line x1="230" y1="105" x2="230" y2="185" stroke="#222" stroke-width="2"/>
      <line x1="220" y1="105" x2="240" y2="105" stroke="#222" stroke-width="2"/>
      <line x1="220" y1="185" x2="240" y2="185" stroke="#222" stroke-width="2"/>
      <text x="248" y="151" font-size="19">10 mm</text>
      <line x1="171" y1="110" x2="300" y2="70" stroke="#222" stroke-width="2"/>
      <text x="310" y="74" font-size="19">2 mm corner break</text>
      <text x="0" y="330" font-size="18">Broad faces + softened edge transition are geometry.</text>
      <text x="0" y="358" font-size="18">0.45 mm oxidation / micro-scratch scale stays in PBR.</text>
      <text x="0" y="386" font-size="18">Dry benchmark: wetness = 0.</text>
    </g>

    <g transform="translate(90 650)">
      <text x="0" y="0" font-size="25" font-weight="700">Installation / evidence checks</text>
      <rect x="0" y="45" width="560" height="220" rx="14" fill="#ffffff" stroke="#888" stroke-width="2"/>
      <text x="25" y="82" font-size="19">• Pivot, lever, receiver and screws remain separate physical parts.</text>
      <text x="25" y="116" font-size="19">• Lever must clear meeting stile, glazing gasket and optical glass.</text>
      <text x="25" y="150" font-size="19">• Contact polish follows handling; recess grime follows shelter geometry.</text>
      <text x="25" y="184" font-size="19">• Metallic grazing highlight must come from BRDF/reflection only.</text>
      <text x="25" y="218" font-size="19">• 8 deterministic 11 mm UV phases reduce synchronized microdetail.</text>
      <text x="25" y="252" font-size="19">• LOD0 curve does not waive temporal LOD-pop or shimmer checks.</text>

      <rect x="610" y="45" width="700" height="220" rx="14" fill="#ffffff" stroke="#888" stroke-width="2"/>
      <text x="635" y="82" font-size="19" font-weight="700">Required actual-render evidence before any Visual Fidelity points</text>
      <text x="635" y="120" font-size="19">Front: facade_center — silhouette scale and meeting-stile seating</text>
      <text x="635" y="154" font-size="19">Oblique: construction_depth — plate/pivot/receiver depth and clearance</text>
      <text x="635" y="188" font-size="19">Grazing: sash_rail_response — edge rolloff and metallic highlight response</text>
      <text x="635" y="222" font-size="19">100% crop: sash_latch_100pct — faceting, aliasing, z-fight, repetition</text>
      <text x="635" y="256" font-size="19">Temporal: verify cross-fade without visible pop or sub-pixel shimmer</text>
    </g>
  </g>
</svg>
