<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f4f1e8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2528">
    <text x="70" y="70" font-size="34" font-weight="700">HD_NoticeBoard — display-case construction lookdev</text>
    <text x="70" y="108" font-size="18">Implementation illustration only. Final fidelity is judged from native 3840×2160 Unity evidence.</text>

    <text x="90" y="165" font-size="24" font-weight="700">Front elevation</text>
    <rect x="100" y="205" width="605" height="332" fill="none" stroke="#3f5963" stroke-width="18"/>
    <rect x="132" y="237" width="541" height="268" fill="#bfc6c1" fill-opacity="0.32" stroke="#171b1d" stroke-width="3"/>
    <rect x="151" y="259" width="501" height="224" fill="#775c3c" fill-opacity="0.38" stroke="#5f4a34" stroke-width="2"/>
    <rect x="210" y="294" width="52" height="74" fill="#e8e0c5" stroke="#777"/>
    <rect x="297" y="382" width="105" height="74" fill="#cbd9de" stroke="#777"/>
    <rect x="420" y="285" width="52" height="74" fill="#eee8d7" stroke="#777"/>
    <rect x="510" y="318" width="74" height="105" fill="#d4ddc8" stroke="#777"/>
    <rect x="605" y="286" width="37" height="53" fill="#e3cfd0" stroke="#777"/>
    <rect x="76" y="182" width="653" height="14" fill="#53686f"/>
    <rect x="125" y="540" width="28" height="250" rx="12" fill="#365e6a"/>
    <rect x="651" y="540" width="28" height="250" rx="12" fill="#365e6a"/>
    <circle cx="104" cy="282" r="6" fill="#7f8586"/><circle cx="104" cy="371" r="6" fill="#7f8586"/><circle cx="104" cy="460" r="6" fill="#7f8586"/>
    <rect x="692" y="355" width="18" height="32" rx="4" fill="#7f8586"/>
    <text x="160" y="570" font-size="16">2 painted tubular posts</text>
    <text x="745" y="204" font-size="16">2.48 m drip hood</text>
    <text x="745" y="242" font-size="16">2.42 × 1.33 m frame</text>
    <text x="745" y="280" font-size="16">2.20 × 1.11 × 0.003 m clear acrylic cover</text>
    <text x="745" y="318" font-size="16">10 mm EPDM perimeter gasket</text>
    <text x="745" y="356" font-size="16">3 left hinge knuckles + right latch</text>
    <text x="745" y="394" font-size="16">5 independent paper notices retained across LOD0–3</text>
    <text x="745" y="432" font-size="16">Only LOD0 retains 7 mm pin heads</text>

    <text x="90" y="830" font-size="24" font-weight="700">Section through face (local Z, camera side = +Z)</text>
    <line x1="640" y1="812" x2="1240" y2="812" stroke="#a2a2a2" stroke-width="2"/>
    <rect x="690" y="770" width="24" height="84" fill="#775c3c"/><text x="680" y="752" font-size="15">18 mm backing</text>
    <rect x="718" y="775" width="3" height="74" fill="#efe8d6"/><text x="728" y="785" font-size="15">0.4 mm paper</text>
    <line x1="722" y1="780" x2="930" y2="780" stroke="#6f7f84" stroke-width="2" stroke-dasharray="8 8"/><text x="784" y="772" font-size="15">~40 mm dry air cavity</text>
    <rect x="930" y="770" width="4" height="84" fill="#b9d7df" fill-opacity="0.65" stroke="#39535b"/><text x="905" y="752" font-size="15">3 mm acrylic</text>
    <rect x="936" y="775" width="8" height="74" fill="#202421"/><text x="950" y="793" font-size="15">EPDM bead</text>
    <rect x="945" y="758" width="80" height="108" fill="none" stroke="#53686f" stroke-width="14"/><text x="1034" y="813" font-size="15">75 mm deep frame</text>
    <text x="1125" y="852" font-size="16" font-weight="700">+Z → benchmark camera side</text>
  </g>
</svg>
