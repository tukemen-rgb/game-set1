    <text x="0" y="297" font-size="18">1. 3840×2160 frontal</text>
    <text x="0" y="328" font-size="18">2. 3840×2160 oblique</text>
    <text x="0" y="359" font-size="18">3. 3840×2160 grazing light</text>
    <text x="0" y="390" font-size="18">4. 100% pipe/socket/support crop</text>
    <text x="0" y="421" font-size="18">5. Temporal LOD sequence</text>

    <text x="0" y="482" font-size="25">Automatic reject</text>
    <text x="0" y="524" font-size="18">• Legacy RainGutter renderer visible</text>
    <text x="0" y="555" font-size="18">• Unity primitive mesh in evidence</text>
    <text x="0" y="586" font-size="18">• Floating support or facade penetration</text>
