<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f4f1e8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202020">
    <text x="70" y="72" font-size="34" font-weight="700">Circa-2000 Japanese apartment balcony guardrail — construction lookdev</text>
    <text x="70" y="108" font-size="19">Generated fallback intent only. Period-plausible vertical-lattice family; not an exact manufacturer/SKU reproduction.</text>

    <text x="90" y="170" font-size="24" font-weight="700">Front elevation / load path</text>
    <line x1="120" y1="720" x2="1010" y2="720" stroke="#555" stroke-width="8"/>
    <text x="1030" y="728" font-size="18">finished balcony floor</text>

    <rect x="145" y="268" width="820" height="28" rx="6" fill="#777d7c" stroke="#303434" stroke-width="3"/>
    <text x="990" y="288" font-size="18">70 mm high × 80 mm deep anodized top rail</text>
    <line x1="130" y1="268" x2="130" y2="720" stroke="#333" stroke-width="2"/>
    <line x1="112" y1="268" x2="148" y2="268" stroke="#333" stroke-width="2"/>
    <line x1="112" y1="720" x2="148" y2="720" stroke="#333" stroke-width="2"/>
    <text x="76" y="505" font-size="20" transform="rotate(-90 76 505)">1100 mm floor → guard top</text>

    <!-- lower capture rail -->
    <rect x="145" y="655" width="820" height="22" fill="#7c8180" stroke="#303434" stroke-width="2"/>
    <text x="990" y="671" font-size="18">existing 40 mm lower capture rail; underside 70 mm above floor</text>

    <!-- support posts on 0.48 m grid -->
    <g fill="#6d7372" stroke="#303434" stroke-width="2">
      <rect x="188" y="292" width="22" height="446"/>
      <rect x="308" y="292" width="22" height="446"/>
      <rect x="428" y="292" width="22" height="446"/>
      <rect x="548" y="292" width="22" height="446"/>
      <rect x="668" y="292" width="22" height="446"/>
      <rect x="788" y="292" width="22" height="446"/>
      <rect x="908" y="292" width="22" height="446"/>
    </g>

    <!-- infill bars, drawn between 120 mm centers -->
    <g fill="#949a99">
      <rect x="128" y="294" width="10" height="363"/>
      <rect x="158" y="294" width="10" height="363"/>
      <rect x="218" y="294" width="10" height="363"/>
      <rect x="248" y="294" width="10" height="363"/>
      <rect x="278" y="294" width="10" height="363"/>
      <rect x="338" y="294" width="10" height="363"/>
      <rect x="368" y="294" width="10" height="363"/>
