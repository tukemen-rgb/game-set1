<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f3f1ea"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2528">
    <text x="50" y="54" font-size="28" font-weight="700">Year-2000 Communal Rooftop Reception — Installation Lookdev</text>
    <text x="50" y="84" font-size="15">Source-side construction reference only. Native 3840×2160 pixels remain required for Visual Fidelity scoring.</text>

    <g transform="translate(55 125)">
      <text x="0" y="0" font-size="20" font-weight="700">Elevation / load path</text>
      <line x1="20" y1="600" x2="720" y2="600" stroke="#555" stroke-width="4"/>
      <text x="24" y="630" font-size="14">roof datum y = 13.20 m</text>

      <rect x="210" y="540" width="95" height="60" fill="#aaa79f" stroke="#444"/>
      <rect x="455" y="540" width="95" height="60" fill="#aaa79f" stroke="#444"/>
      <rect x="190" y="515" width="380" height="25" fill="#777b7a" stroke="#333"/>
      <text x="575" y="534" font-size="13">galvanized base rail</text>
      <text x="210" y="662" font-size="13">0.42 × 0.12 × 0.42 m precast ballast; four total</text>

      <line x1="380" y1="515" x2="380" y2="145" stroke="#6d7475" stroke-width="12"/>
      <text x="397" y="170" font-size="14">48 mm OD mast; 3.28 m above roof</text>

      <rect x="353" y="415" width="54" height="34" rx="8" fill="#777b7a" stroke="#333"/>
      <text x="415" y="438" font-size="13">82 mm OD × 110 mm stayed collar @ 0.98 m</text>

      <line x1="238" y1="515" x2="361" y2="432" stroke="#7f8584" stroke-width="7"/>
      <line x1="522" y1="515" x2="399" y2="432" stroke="#7f8584" stroke-width="7"/>
      <text x="42" y="392" font-size="13">25 mm galvanized stays</text>
      <path d="M170 397 L265 500" fill="none" stroke="#333" stroke-width="1.5"/>
      <text x="42" y="412" font-size="13">four-way triangulation persists in LOD0/1/2/3</text>

      <rect x="220" y="498" width="46" height="16" fill="#777b7a" stroke="#333"/>
      <rect x="494" y="498" width="46" height="16" fill="#777b7a" stroke="#333"/>
      <text x="72" y="490" font-size="13">LOD0/1: formed stay feet land on rail top, not roof membrane</text>

      <line x1="205" y1="220" x2="555" y2="220" stroke="#6d7475" stroke-width="7"/>
      <line x1="260" y1="212" x2="260" y2="228" stroke="#6d7475" stroke-width="5"/>
      <line x1="310" y1="207" x2="310" y2="233" stroke="#6d7475" stroke-width="5"/>
      <line x1="360" y1="202" x2="360" y2="238" stroke="#6d7475" stroke-width="5"/>
      <line x1="410" y1="198" x2="410" y2="242" stroke="#6d7475" stroke-width="5"/>
      <line x1="460" y1="194" x2="460" y2="246" stroke="#6d7475" stroke-width="5"/>
      <line x1="510" y1="190" x2="510" y2="250" stroke="#6d7475" stroke-width="5"/>
      <text x="566" y="226" font-size="13">compact UHF array</text>

      <line x1="115" y1="115" x2="645" y2="115" stroke="#6d7475" stroke-width="8"/>
      <line x1="165" y1="72" x2="165" y2="158" stroke="#6d7475" stroke-width="5"/>
      <line x1="230" y1="76" x2="230" y2="154" stroke="#6d7475" stroke-width="5"/>
      <line x1="295" y1="80" x2="295" y2="150" stroke="#6d7475" stroke-width="5"/>
      <line x1="360" y1="84" x2="360" y2="146" stroke="#6d7475" stroke-width="5"/>
      <line x1="425" y1="88" x2="425" y2="142" stroke="#6d7475" stroke-width="5"/>
      <line x1="490" y1="92" x2="490" y2="138" stroke="#6d7475" stroke-width="5"/>
      <line x1="555" y1="96" x2="555" y2="134" stroke="#6d7475" stroke-width="5"/>
      <line x1="620" y1="100" x2="620" y2="130" stroke="#6d7475" stroke-width="5"/>
      <text x="650" y="120" font-size="13">larger VHF array</text>

      <line x1="392" y1="170" x2="392" y2="500" stroke="#252729" stroke-width="4"/>
      <g fill="#252729">
        <rect x="377" y="220" width="30" height="7"/><rect x="377" y="270" width="30" height="7"/>
        <rect x="377" y="320" width="30" height="7"/><rect x="377" y="370" width="30" height="7"/>
        <rect x="377" y="420" width="30" height="7"/><rect x="377" y="470" width="30" height="7"/>
      </g>
      <text x="430" y="360" font-size="13">LOD0/1: six UV-resistant coax clips bridge cable to mast</text>
    </g>

    <g transform="translate(825 130)">
      <text x="0" y="0" font-size="20" font-weight="700">Plan / four-way restraint</text>
      <rect x="115" y="120" width="95" height="95" fill="#aaa79f" stroke="#444"/>
      <rect x="365" y="120" width="95" height="95" fill="#aaa79f" stroke="#444"/>
      <rect x="115" y="370" width="95" height="95" fill="#aaa79f" stroke="#444"/>
      <rect x="365" y="370" width="95" height="95" fill="#aaa79f" stroke="#444"/>
      <rect x="90" y="235" width="395" height="30" fill="#777b7a" stroke="#333"/>
      <rect x="90" y="320" width="395" height="30" fill="#777b7a" stroke="#333"/>
      <circle cx="287" cy="292" r="24" fill="#727979" stroke="#222" stroke-width="3"/>
      <line x1="115" y1="250" x2="287" y2="292" stroke="#7f8584" stroke-width="6"/>
      <line x1="460" y1="250" x2="287" y2="292" stroke="#7f8584" stroke-width="6"/>
      <line x1="115" y1="335" x2="287" y2="292" stroke="#7f8584" stroke-width="6"/>
      <line x1="460" y1="335" x2="287" y2="292" stroke="#7f8584" stroke-width="6"/>
      <text x="82" y="510" font-size="13">Each diagonal terminates at a rail-mounted foot and a mast-collar lug.</text>
      <text x="82" y="532" font-size="13">No stay endpoint is allowed to float or penetrate the roof.</text>

      <text x="0" y="590" font-size="20" font-weight="700">Material / weathering checks</text>
      <text x="0" y="620" font-size="13">• Galvanized steel: metallic 1.0, roughness intent 0.62–0.76; environment-driven Fresnel only.</text>
      <text x="0" y="644" font-size="13">• ABS / coax PVC / concrete: dielectric F0 ≈ 0.04, no metallic response.</text>
      <text x="0" y="668" font-size="13">• Dry midsummer state: no global wet gloss; zinc dulling and UV chalking are exposure-driven.</text>
      <text x="0" y="692" font-size="13">• Local runoff may originate below collar/lug/foot interfaces; no arbitrary rust or baked AO.</text>
      <text x="0" y="734" font-size="14" font-weight="700">Native-4K review: hero + oblique rooftop 100% crops; grazing metallic response; temporal LOD shimmer/pop.</text>
    </g>
  </g>
</svg>
