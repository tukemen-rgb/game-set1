<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f5f3ee"/>
  <style>
    text{font-family:Arial,sans-serif;fill:#222}
    .h{font-size:28px;font-weight:700}.t{font-size:18px}.s{font-size:15px}
    .dim{stroke:#333;stroke-width:2;fill:none}.guide{stroke:#777;stroke-width:1.5;stroke-dasharray:7 6}
  </style>
  <text x="60" y="55" class="h">HD_Bench construction lookdev — source interface target</text>
  <text x="60" y="85" class="s">Dimensional implementation guidance only. Not render evidence and awards 0 Visual Fidelity points.</text>

  <text x="70" y="135" class="t">A. Seat/load-path cross-section (local Y, schematic)</text>
  <line x1="70" y1="670" x2="650" y2="670" stroke="#555" stroke-width="3"/>
  <text x="75" y="700" class="s">grade Y=0.000</text>
  <rect x="170" y="490" width="330" height="42" rx="4" fill="#8b5e3c"/>
  <text x="510" y="518" class="s">timber slats, 42 mm</text>
  <rect x="205" y="532" width="260" height="45" rx="3" fill="#6d7477"/>
  <text x="475" y="560" class="s">steel bearer, 45 mm</text>
  <rect x="255" y="577" width="160" height="159" fill="#b9b5aa"/>
  <rect x="245" y="646" width="180" height="90" fill="#7f7c74" opacity="0.62"/>
  <text x="430" y="625" class="s">precast support</text>
  <text x="430" y="655" class="s">visible 120 mm contact/splash band</text>
  <line x1="250" y1="670" x2="420" y2="670" class="guide"/>
  <text x="430" y="684" class="s">support continues 66 mm below grade at LOD0/1</text>
  <circle cx="300" cy="484" r="11" fill="#64686a"/>
  <line x1="300" y1="484" x2="300" y2="500" stroke="#64686a" stroke-width="10"/>
  <text x="320" y="476" class="s">8 mm bolt head; bottom Y=0.579</text>
  <text x="320" y="496" class="s">2 mm embed into slat top Y=0.581</text>
  <text x="80" y="540" class="s">slat bottom Y=0.539</text>
  <text x="80" y="565" class="s">bearer top Y=0.539</text>
  <text x="80" y="590" class="s">bearer bottom / support top Y=0.494</text>

  <text x="760" y="135" class="t">B. LOD0 bolt/slat plan (local Z, schematic)</text>
  <g transform="translate(770,180)">
    <rect x="0" y="0" width="500" height="70" rx="5" fill="#8b5e3c"/>
    <rect x="0" y="88" width="500" height="70" rx="5" fill="#8b5e3c"/>
    <rect x="0" y="176" width="500" height="70" rx="5" fill="#8b5e3c"/>
    <rect x="0" y="264" width="500" height="70" rx="5" fill="#8b5e3c"/>
    <rect x="0" y="352" width="500" height="70" rx="5" fill="#8b5e3c"/>
    <circle cx="80" cy="35" r="13" fill="#64686a"/><circle cx="420" cy="35" r="13" fill="#64686a"/>
    <circle cx="80" cy="387" r="13" fill="#64686a"/><circle cx="420" cy="387" r="13" fill="#64686a"/>
    <text x="515" y="40" class="s">outer slat center Z = -0.235 m</text>
    <text x="515" y="392" class="s">outer slat center Z = +0.235 m</text>
    <text x="20" y="455" class="s">Bolt centers must lie over timber, not in the 15.5 mm inter-slat gaps.</text>
    <text x="20" y="480" class="s">X centers remain ±1.02 m; minimum center-to-slat-edge margin = 20 mm.</text>
  </g>

  <text x="760" y="720" class="t">Material response intent</text>
  <text x="760" y="748" class="s">Timber: dielectric, broad rough lobe • Steel: real environment reflection • Concrete: rough dielectric</text>
  <text x="760" y="775" class="s">No baked AO/contact shadow; contact must read from geometry + coherent midsummer sun/sky/reflection.</text>
</svg>
