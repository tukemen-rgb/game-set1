<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f3f1eb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222">
    <text x="70" y="72" font-size="34" font-weight="700">Balcony clothes-pole support — generated fallback lookdev</text>
    <text x="70" y="108" font-size="18">Period-plausible Japanese multi-family/public-housing style; exact manufacturer/model not claimed.</text>

    <text x="80" y="170" font-size="24" font-weight="700">A. Side-wall support construction</text>
    <rect x="90" y="205" width="18" height="420" fill="#b7b7b1" stroke="#333" stroke-width="2"/>
    <text x="58" y="655" font-size="16">substrate</text>
    <rect x="108" y="315" width="32" height="200" fill="#70736f" stroke="#222" stroke-width="2"/>
    <circle cx="124" cy="360" r="9" fill="#555854"/>
    <circle cx="124" cy="470" r="9" fill="#555854"/>
    <text x="145" y="355" font-size="16">14 mm plate; 110 mm anchor pitch</text>
    <circle cx="151" cy="415" r="14" fill="#61645f" stroke="#222" stroke-width="2"/>
    <line x1="151" y1="415" x2="315" y2="300" stroke="#646763" stroke-width="50" stroke-linecap="round"/>
    <circle cx="315" cy="300" r="45" fill="none" stroke="#646763" stroke-width="26"/>
    <circle cx="315" cy="300" r="19" fill="#f3f1eb"/>
    <text x="330" y="280" font-size="16">receiver OD 90 mm</text>
    <text x="330" y="304" font-size="16">clear bore ID 38 mm</text>
    <text x="330" y="328" font-size="16">axial depth 24 mm</text>
    <line x1="151" y1="545" x2="315" y2="545" stroke="#333" stroke-width="2"/>
    <line x1="151" y1="535" x2="151" y2="555" stroke="#333" stroke-width="2"/>
    <line x1="315" y1="535" x2="315" y2="555" stroke="#333" stroke-width="2"/>
    <text x="185" y="575" font-size="16">nominal arm 420 mm</text>

    <text x="610" y="170" font-size="24" font-weight="700">B. Front / pole-axis relationship</text>
    <rect x="650" y="235" width="20" height="360" fill="#b7b7b1"/>
    <rect x="1230" y="235" width="20" height="360" fill="#b7b7b1"/>
    <circle cx="705" cy="380" r="45" fill="none" stroke="#646763" stroke-width="26"/>
    <circle cx="1195" cy="380" r="45" fill="none" stroke="#646763" stroke-width="26"/>
    <line x1="724" y1="380" x2="1176" y2="380" stroke="#8a8d88" stroke-width="10" stroke-dasharray="22 12"/>
    <text x="820" y="356" font-size="18">conceptual pole axis X</text>
    <text x="760" y="428" font-size="16">left/right bores must be coaxial in Y/Z</text>
    <line x1="705" y1="455" x2="1195" y2="455" stroke="#333" stroke-width="2"/>
    <text x="850" y="483" font-size="16">~2.94 m receiver center span in fallback bay</text>

    <text x="610" y="560" font-size="24" font-weight="700">C. Material / optical target</text>
    <rect x="650" y="600" width="180" height="92" fill="#4d4f4d" stroke="#222" stroke-width="2"/>
    <text x="850" y="625" font-size="17">aged galvanized steel</text>
    <text x="850" y="650" font-size="16">sRGB ≈ 0.30 / 0.31 / 0.30</text>
    <text x="850" y="675" font-size="16">roughness 0.48–0.72; metallic 0.75–1.0; F0 ≈ 0.68</text>
    <text x="650" y="725" font-size="16">Front: compact subdued metal lobe. Grazing: stronger edge reflection broadened by oxidation.</text>
    <text x="650" y="750" font-size="16">Never bake sun streaks/highlights into albedo. Wetness is 0 for formal dry benchmark.</text>

    <text x="80" y="805" font-size="24" font-weight="700">D. Evidence checklist</text>
    <text x="95" y="842" font-size="17">• 3840×2160 frontal: pair reads as installed hardware, not pegs/boxes.</text>
    <text x="95" y="870" font-size="17">• Oblique: plate seating, pivot depth, open receiver bore and pole-axis alignment remain legible.</text>
    <text x="95" y="898" font-size="17">• Grazing: physical metallic Fresnel/roughness response; no painted highlight.</text>
    <text x="95" y="926" font-size="17">• 100% crop: two anchors, annular hole, contact gaps; no float/intersection.</text>
    <text x="95" y="954" font-size="17">• Temporal: receiver ring and LOD reduction show no shimmer/pop.</text>

    <text x="1180" y="830" font-size="15">Visual points: 0 from source QA</text>
    <text x="1180" y="855" font-size="15">Render verification: pending</text>
    <text x="1180" y="880" font-size="15">Weathering: cause-based only</text>
    <text x="1180" y="905" font-size="15">Forbidden: disaster themes</text>
  </g>
</svg>
