<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f2f0e9"/>
  <g font-family="sans-serif" fill="#222">
    <text x="48" y="55" font-size="30" font-weight="700">Outdoor condenser fan — physical reconstruction lookdev</text>
    <text x="48" y="86" font-size="16">Manufacturer-neutral benchmark assumption; verify only from native 4K render. No painted highlights.</text>
  </g>
  <g transform="translate(315 365)">
    <circle r="210" fill="#c9c7bd" stroke="#444" stroke-width="8"/>
    <circle r="184" fill="#333936" stroke="#555" stroke-width="4"/>
    <g fill="#262b29" stroke="#101211" stroke-width="2">
      <path d="M 38,-8 C 76,-35 132,-55 164,-29 C 142,-2 91,20 47,25 Z"/>
      <path d="M 38,-8 C 76,-35 132,-55 164,-29 C 142,-2 91,20 47,25 Z" transform="rotate(72)"/>
      <path d="M 38,-8 C 76,-35 132,-55 164,-29 C 142,-2 91,20 47,25 Z" transform="rotate(144)"/>
      <path d="M 38,-8 C 76,-35 132,-55 164,-29 C 142,-2 91,20 47,25 Z" transform="rotate(216)"/>
      <path d="M 38,-8 C 76,-35 132,-55 164,-29 C 142,-2 91,20 47,25 Z" transform="rotate(288)"/>
    </g>
    <circle r="36" fill="#202422" stroke="#111" stroke-width="3"/>
    <g fill="none" stroke="#60635f" stroke-width="5">
      <circle r="52"/><circle r="96"/><circle r="140"/><circle r="184"/>
      <path d="M0,-188V188 M-188,0H188 M-133,-133L133,133 M133,-133L-133,133"/>
    </g>
  </g>
  <g font-family="sans-serif" fill="#222" font-size="18">
    <text x="575" y="185" font-weight="700">Manufacture / installation stack</text>
    <text x="575" y="220">1. molded casing front + 18 mm annular inlet shroud</text>
    <text x="575" y="252">2. recessed five-blade axial rotor, Ø330 mm assumption</text>
    <text x="575" y="284">3. hub on existing motor axis</text>
    <text x="575" y="316">4. circular guard: four rings + eight spokes, Ø5 mm wire</text>
    <text x="575" y="358" font-weight="700">Material response</text>
    <text x="575" y="393">Rotor/shroud: dark dielectric polymer, metallic ≤ 0.02</text>
    <text x="575" y="425">Guard: aged galvanized steel, metallic response retained</text>
    <text x="575" y="457">Dry benchmark: wetness = 0; highlights come from light/geometry</text>
    <text x="575" y="499" font-weight="700">Cause-based aging</text>
    <text x="575" y="534">Rotor: recessed dust + mild UV only</text>
    <text x="575" y="566">Shroud: UV dulling / lip rain exposure / recess dust</text>
    <text x="575" y="598">Guard: rain + UV; no rust without ferrous coating breach</text>
    <text x="575" y="640" font-weight="700">LOD evidence</text>
    <text x="575" y="675">LOD0 full → LOD1 full → LOD2 no wire guard → LOD3 shroud silhouette</text>
    <text x="575" y="707">Check oblique/balcony_services crop for aliasing, intersections, toy-like repetition.</text>
  </g>
