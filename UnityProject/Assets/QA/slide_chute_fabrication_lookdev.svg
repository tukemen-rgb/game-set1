<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f4f1e9"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#171717">
    <text x="55" y="60" font-size="32" font-weight="700">HD_Slide — fabricated SUS304 chute lookdev</text>
    <text x="55" y="92" font-size="17">Construction guidance only — not rendered Visual Fidelity evidence</text>

    <text x="70" y="150" font-size="22" font-weight="700">A. Cross-section / sheet volume</text>
    <g transform="translate(95,205)">
      <path d="M 0 250 L 0 38 L 4 38 L 4 246 L 456 246 L 456 38 L 460 38 L 460 250 Z" fill="#c5c8c8" stroke="#222" stroke-width="2"/>
      <line x1="0" y1="285" x2="460" y2="285" stroke="#555" stroke-width="1.5"/>
      <line x1="0" y1="273" x2="0" y2="298" stroke="#555"/>
      <line x1="460" y1="273" x2="460" y2="298" stroke="#555"/>
      <text x="173" y="315" font-size="18">920 mm overall</text>
      <line x1="-38" y1="38" x2="-38" y2="250" stroke="#555" stroke-width="1.5"/>
      <line x1="-50" y1="38" x2="-25" y2="38" stroke="#555"/>
      <line x1="-50" y1="250" x2="-25" y2="250" stroke="#555"/>
      <text x="-82" y="150" font-size="17" transform="rotate(-90 -82,150)">140 mm side wall</text>
      <path d="M 205 233 L 255 233" stroke="#a33" stroke-width="2"/>
      <text x="265" y="238" font-size="17">2.0 mm SUS304 sheet solid</text>
      <text x="65" y="350" font-size="16">One watertight net sheet volume: running surface + both side walls.</text>
      <text x="65" y="373" font-size="16">No overlapping coplanar shells; no open longitudinal edge.</text>
    </g>

    <text x="720" y="150" font-size="22" font-weight="700">B. Side elevation / load path</text>
    <g transform="translate(745,205)">
      <path d="M 30 35 C 170 90 270 235 425 290 C 500 316 555 318 610 316" fill="none" stroke="#777" stroke-width="8"/>
      <path d="M 30 35 C 170 90 270 235 425 290 C 500 316 555 318 610 316" fill="none" stroke="#c6c9c9" stroke-width="4"/>
      <line x1="32" y1="46" x2="32" y2="98" stroke="#2d5775" stroke-width="12"/>
      <line x1="607" y1="326" x2="607" y2="384" stroke="#2d5775" stroke-width="12"/>
      <rect x="-22" y="92" width="108" height="12" fill="#2d5775"/>
      <rect x="554" y="382" width="108" height="12" fill="#2d5775"/>
      <text x="0" y="128" font-size="16">head bearer</text>
      <text x="532" y="420" font-size="16">runout bearer</text>
      <text x="190" y="115" font-size="16">continuous Hermite descent</text>
      <text x="354" y="268" font-size="16">transition radius ≥ 0.75 m</text>
      <text x="405" y="290" font-size="15">generated curve ≈ 2.79 m minimum</text>
      <text x="0" y="455" font-size="16">Head z=0.18 m / y=1.99 m</text>
      <text x="0" y="480" font-size="16">Runout z=4.38 m / y=0.15 m</text>
    </g>

    <text x="70" y="695" font-size="22" font-weight="700">C. QA intent</text>
    <text x="70" y="730" font-size="17">Hard fail: any geometric boundary edge, non-manifold edge, zero-area triangle, wrong stainless binding, LOD fallback to legacy box/open shell, or added gameplay collider.</text>
    <text x="70" y="758" font-size="17">4K proof still required: oblique/grazing crops must show thin metal, closed ends, supported contact, coherent reflection and no temporal pop.</text>
    <text x="70" y="787" font-size="15">Reference envelope: Yokohama City park slide guidance; current sheets used for construction principle only, not exact circa-2000 product identity.</text>
  </g>
</svg>
