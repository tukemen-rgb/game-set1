<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f3f1eb"/>
  <style>
    .t{font-family:Arial,'Noto Sans',sans-serif;fill:#20242a}.h{font-size:34px;font-weight:700}.s{font-size:22px;font-weight:700}.b{font-size:18px}.sm{font-size:15px}.dim{stroke:#555;stroke-width:2;fill:none}.thin{stroke:#333;stroke-width:2;fill:none}.dash{stroke:#777;stroke-width:2;stroke-dasharray:9 7;fill:none}
  </style>
  <text x="60" y="60" class="t h">Generated Danchi Window Aperture — construction/lookdev reference</text>
  <text x="60" y="92" class="t b">Source-side installation target only. Native 3840×2160 hero / oblique / grazing renders remain required for Visual Fidelity scoring.</text>

  <!-- Front elevation -->
  <g transform="translate(70,150)">
    <text x="0" y="0" class="t s">A. Exterior elevation — one repeated apartment bay</text>
    <rect x="40" y="50" width="620" height="450" fill="#a5a39d" stroke="#333" stroke-width="3"/>
    <rect x="190" y="150" width="360" height="270" fill="#d8dce0" stroke="#333" stroke-width="3"/>
    <rect x="205" y="165" width="330" height="240" fill="#8797a1" opacity="0.45" stroke="#5e6b72" stroke-width="2"/>
    <rect x="212" y="172" width="316" height="226" fill="none" stroke="#1d2023" stroke-width="8"/>
    <line x1="370" y1="172" x2="370" y2="398" stroke="#73777a" stroke-width="12"/>
    <line x1="385" y1="172" x2="385" y2="398" stroke="#777b7d" stroke-width="12"/>
    <line x1="205" y1="165" x2="535" y2="165" stroke="#242628" stroke-width="4"/>
    <line x1="205" y1="405" x2="535" y2="405" stroke="#242628" stroke-width="4"/>
    <line x1="205" y1="165" x2="205" y2="405" stroke="#242628" stroke-width="4"/>
    <line x1="535" y1="165" x2="535" y2="405" stroke="#242628" stroke-width="4"/>

    <text x="58" y="78" class="t sm">painted RC facade / wall pieces</text>
    <line x1="220" y1="90" x2="290" y2="140" class="thin"/>
    <text x="555" y="205" class="t sm">20 mm nominal frame-to-opening clearance</text>
    <line x1="548" y1="210" x2="535" y2="210" class="thin"/>
    <text x="555" y="245" class="t sm">14 mm visible dark perimeter seal</text>
    <line x1="548" y1="250" x2="535" y2="250" class="thin"/>
    <text x="555" y="285" class="t sm">2 overlapping sliding glass leaves</text>
    <line x1="548" y1="290" x2="410" y2="290" class="thin"/>

    <line x1="190" y1="455" x2="550" y2="455" class="dim"/>
    <line x1="190" y1="445" x2="190" y2="468" class="dim"/>
    <line x1="550" y1="445" x2="550" y2="468" class="dim"/>
    <text x="320" y="482" class="t b">rough opening 2.40 m</text>
    <line x1="150" y1="150" x2="150" y2="420" class="dim"/>
    <line x1="140" y1="150" x2="163" y2="150" class="dim"/>
    <line x1="140" y1="420" x2="163" y2="420" class="dim"/>
    <text x="82" y="300" class="t b" transform="rotate(-90 82 300)">rough opening 1.80 m</text>
  </g>

  <!-- Section -->
  <g transform="translate(830,150)">
    <text x="0" y="0" class="t s">B. Horizontal section — exterior at left</text>
    <rect x="80" y="95" width="220" height="320" fill="#a5a39d" stroke="#333" stroke-width="3"/>
    <rect x="80" y="205" width="220" height="100" fill="#f3f1eb" stroke="none"/>
    <rect x="61" y="214" width="52" height="82" fill="#777b7d" stroke="#333" stroke-width="2"/>
    <rect x="100" y="218" width="14" height="74" fill="#242628"/>
    <line x1="120" y1="226" x2="120" y2="284" stroke="#7b929f" stroke-width="4"/>
    <line x1="134" y1="226" x2="134" y2="284" stroke="#839aa6" stroke-width="4"/>
    <rect x="270" y="222" width="8" height="66" fill="#64676a" opacity="0.9"/>

    <line x1="80" y1="455" x2="300" y2="455" class="dim"/>
    <line x1="80" y1="445" x2="80" y2="468" class="dim"/>
    <line x1="300" y1="445" x2="300" y2="468" class="dim"/>
    <text x="120" y="484" class="t b">RC front shell 0.22 m</text>

    <text x="0" y="220" class="t sm">exterior</text>
    <line x1="55" y1="225" x2="80" y2="225" class="thin"/>
    <text x="0" y="260" class="t sm">aluminum sash</text>
    <line x1="55" y1="265" x2="78" y2="265" class="thin"/>
    <text x="0" y="300" class="t sm">EPDM/rubber seal</text>
    <line x1="55" y1="305" x2="100" y2="285" class="thin"/>
    <text x="315" y="238" class="t sm">glass leaf A</text>
    <line x1="300" y1="242" x2="120" y2="242" class="thin"/>
    <text x="315" y="274" class="t sm">glass leaf B, 14 mm depth offset</text>
    <line x1="300" y1="278" x2="134" y2="278" class="thin"/>
    <text x="315" y="315" class="t sm">non-emissive interior/backing deeper inside</text>
    <line x1="300" y1="320" x2="274" y2="285" class="thin"/>

    <text x="0" y="550" class="t s">Material / angular-response checks</text>
    <text x="0" y="585" class="t b">• RC: rough dielectric; aggregate/pores in normal + microtexture, not silhouette-scale fake relief.</text>
    <text x="0" y="617" class="t b">• Aluminum: restrained manufactured highlight that strengthens naturally at grazing angle.</text>
    <text x="0" y="649" class="t b">• Glass: metallic 0, near-flat normal, reflection increases toward grazing; no painted sky/key streak.</text>
    <text x="0" y="681" class="t b">• Seal: dark matte dielectric joint; small physical thickness and recessed grime/wetness only where causal.</text>
    <text x="0" y="725" class="t b">LOD0 keeps aperture depth + seals + both glass planes. Any later LOD must never close the opening.</text>
  </g>

  <text x="70" y="850" class="t sm">Historical scope: generic public-housing aluminum sliding sash appropriate to the circa-2000 scene; dimensions above are controlled fallback-model assumptions, not a claim for a named manufacturer product.</text>
</svg>
